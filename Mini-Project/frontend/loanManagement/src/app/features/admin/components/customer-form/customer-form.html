<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-4"><ol class="breadcrumb"><li class="breadcrumb-item"><a routerLink="/admin/dashboard" class="text-decoration-none">Dashboard</a></li><li class="breadcrumb-item"><a routerLink="/admin/customers" class="text-decoration-none">Customers</a></li><li class="breadcrumb-item active">{{ isEdit() ? 'Edit' : 'Add' }} Customer</li></ol></nav>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-person-plus me-2"></i>{{ isEdit() ? 'Edit' : 'Add' }} Customer</h5>
        </div>
        <div class="card-body p-4">
          @if (error()) { <div class="alert alert-danger small"><i class="bi bi-exclamation-circle me-1"></i>{{ error() }}</div> }
          <form (ngSubmit)="onSubmit()" #custForm="ngForm">
            <div class="mb-3"><label class="form-label">Full Name *</label><input type="text" class="form-control" name="customerName" [(ngModel)]="form.customerName" required minlength="2"></div>
            <div class="mb-3"><label class="form-label">Email *</label><input type="email" class="form-control" name="email" [(ngModel)]="form.email" required email></div>
            <div class="mb-3"><label class="form-label">Password *</label><input type="password" class="form-control" name="password" [(ngModel)]="form.password" [required]="!isEdit()" minlength="8" placeholder="{{ isEdit() ? 'Leave blank to keep current' : '' }}"></div>
            <div class="mb-3"><label class="form-label">Branch *</label><select class="form-select" name="branch" [(ngModel)]="form.branch" required><option value="">Select</option><option>Bangalore</option><option>Mumbai</option><option>Delhi</option><option>Chennai</option><option>Hyderabad</option><option>Kolkata</option><option>Pune</option></select></div>
            <div class="mb-3"><label class="form-label">Role *</label><select class="form-select" name="role" [(ngModel)]="form.role" required><option>USER</option><option>ADMIN</option><option>MANAGER</option><option>UNDERWRITER</option></select></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4" [disabled]="custForm.invalid || loading()">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span>Saving... } @else { <i class="bi bi-check-circle me-2"></i>{{ isEdit() ? 'Update' : 'Create' }} }
              </button>
              <a routerLink="/admin/customers" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
