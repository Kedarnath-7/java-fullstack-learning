<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/admin/dashboard" class="text-decoration-none">Dashboard</a></li>
      <li class="breadcrumb-item"><a routerLink="/admin/customers" class="text-decoration-none">Customers</a></li>
      <li class="breadcrumb-item active">Add Customer</li>
    </ol>
  </nav>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-person-plus me-2"></i>Add Customer</h5>
        </div>
        <div class="card-body p-4">
          <!-- CustomerRequestDTO fields -->
          <form>
            <div class="mb-3">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Enter full name">
            </div>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" placeholder="email&#64;example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" placeholder="Min 8 characters">
            </div>
            <div class="mb-3">
              <label class="form-label">Branch <span class="text-danger">*</span></label>
              <select class="form-select">
                <option value="">Select Branch</option>
                <option>Bangalore</option>
                <option>Mumbai</option>
                <option>Delhi</option>
                <option>Chennai</option>
                <option>Hyderabad</option>
                <option>Kolkata</option>
                <option>Pune</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Role <span class="text-danger">*</span></label>
              <select class="form-select">
                <option value="">Select Role</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
                <option value="MANAGER">MANAGER</option>
                <option value="UNDERWRITER">UNDERWRITER</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-plus-circle me-2"></i>Create Customer
              </button>
              <a routerLink="/admin/customers" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
