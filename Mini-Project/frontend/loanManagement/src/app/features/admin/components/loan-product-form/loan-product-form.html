<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-4"><ol class="breadcrumb"><li class="breadcrumb-item"><a routerLink="/admin/dashboard" class="text-decoration-none">Dashboard</a></li><li class="breadcrumb-item"><a routerLink="/admin/loan-products" class="text-decoration-none">Products</a></li><li class="breadcrumb-item active">{{ isEdit() ? 'Edit' : 'Add' }}</li></ol></nav>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3"><h5 class="fw-bold mb-0"><i class="bi bi-box me-2"></i>{{ isEdit() ? 'Edit' : 'Add' }} Loan Product</h5></div>
        <div class="card-body p-4">
          @if (error()) { <div class="alert alert-danger small"><i class="bi bi-exclamation-circle me-1"></i>{{ error() }}</div> }
          <form (ngSubmit)="onSubmit()" #prodForm="ngForm">
            <div class="mb-3"><label class="form-label">Loan Code *</label><input type="text" class="form-control" name="loanCode" [(ngModel)]="form.loanCode" required maxlength="20" [readonly]="isEdit()"></div>
            <div class="mb-3"><label class="form-label">Loan Name *</label><input type="text" class="form-control" name="loanName" [(ngModel)]="form.loanName" required minlength="2"></div>
            <div class="mb-3"><label class="form-label">Loan Type *</label><select class="form-select" name="loanType" [(ngModel)]="form.loanType" required><option value="">Select</option><option>HOME</option><option>PERSONAL</option><option>EDUCATION</option><option>VEHICLE</option><option>BUSINESS</option></select></div>
            <div class="mb-3"><label class="form-label">Interest Rate (%) *</label><input type="number" class="form-control" name="interestRate" [(ngModel)]="form.interestRate" required min="0.1" step="0.1"></div>
            <div class="mb-3"><label class="form-label">Daily Penalty Rate (%) *</label><input type="number" class="form-control" name="dailyPenaltyRate" [(ngModel)]="form.dailyPenaltyRate" required min="0" step="0.01"></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4" [disabled]="prodForm.invalid || loading()">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span>Saving... } @else { <i class="bi bi-check-circle me-2"></i>{{ isEdit() ? 'Update' : 'Create' }} }
              </button>
              <a routerLink="/admin/loan-products" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
