<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 120px);">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <img src="logo_withOutBGColorLightMode.png" alt="NorthernArc" height="48" class="mb-3 logo-light">
            <img src="logo_withOutBGColorDarkMode.png" alt="NorthernArc" height="48" class="mb-3 logo-dark">
            <h4 class="fw-bold mt-2">Welcome Back</h4>
            <p class="text-muted small">Sign in to your account</p>
          </div>

          @if (auth.error()) {
            <div class="alert alert-danger small py-2">
              <i class="bi bi-exclamation-circle me-1"></i>{{ auth.error() }}
            </div>
          }

          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                  [(ngModel)]="email" required email placeholder="your@email.com">
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                  [(ngModel)]="password" required minlength="8" placeholder="Enter password">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loginForm.invalid || auth.loading()">
              @if (auth.loading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
              } @else {
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
              }
            </button>
          </form>

          <div class="text-center">
            <p class="small text-muted mb-0">Don't have an account? <a routerLink="/auth/register" class="text-decoration-none">Register</a></p>
          </div>

          <hr>
          <div class="small">
            <p class="fw-bold text-muted mb-2">Demo Credentials:</p>
            <div class="d-flex flex-column gap-1">
              <button class="btn btn-outline-secondary btn-sm text-start" (click)="fillCredentials('admin@northernarc.com','Admin@123')">
                <i class="bi bi-person-fill-gear me-1"></i>Admin
              </button>
              <button class="btn btn-outline-secondary btn-sm text-start" (click)="fillCredentials('manager@northernarc.com','Manager@123')">
                <i class="bi bi-person-fill-lock me-1"></i>Manager
              </button>
              <button class="btn btn-outline-secondary btn-sm text-start" (click)="fillCredentials('underwriter@northernarc.com','Underwriter@123')">
                <i class="bi bi-clipboard-check me-1"></i>Underwriter
              </button>
              <button class="btn btn-outline-secondary btn-sm text-start" (click)="fillCredentials('rahul.sharma@northernarc.com','password123')">
                <i class="bi bi-person me-1"></i>Customer (Rahul)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
