<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/customer/dashboard" class="text-decoration-none">Dashboard</a></li>
      <li class="breadcrumb-item active">Apply for Loan</li>
    </ol>
  </nav>
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>Loan Application Form</h5>
        </div>
        <div class="card-body p-4">
          @if (error()) {
            <div class="alert alert-danger small"><i class="bi bi-exclamation-circle me-1"></i>{{ error() }}</div>
          }
          @if (success()) {
            <div class="alert alert-success small"><i class="bi bi-check-circle me-1"></i>Application submitted! Redirecting...</div>
          }
          <form (ngSubmit)="onSubmit()" #loanForm="ngForm">
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-box me-2"></i>Select Loan Product</h6>
              <select class="form-select" name="loanCode" [(ngModel)]="form.loanCode" required>
                <option value="">-- Select a Loan Product --</option>
                @for (p of productService.products(); track p.loanCode) {
                  <option [value]="p.loanCode">{{ p.loanCode }} - {{ p.loanName }} ({{ p.interestRate }}%)</option>
                }
              </select>
            </div>
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-cash-stack me-2"></i>Loan Details</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Loan Amount <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text">&#8377;</span>
                    <input type="number" class="form-control" name="loanAmount" [(ngModel)]="form.loanAmount" required min="1">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">EMI Amount <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text">&#8377;</span>
                    <input type="number" class="form-control" name="emiAmount" [(ngModel)]="form.emiAmount" required min="1">
                  </div>
                </div>
              </div>
            </div>
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-calendar3 me-2"></i>Dates</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Start Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" name="loanStartDate" [(ngModel)]="form.loanStartDate" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">First EMI Due <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" name="emiDueDate" [(ngModel)]="form.emiDueDate" required>
                </div>
              </div>
            </div>
            <div class="alert alert-info small"><i class="bi bi-info-circle me-2"></i>Your application will be submitted as <strong>PENDING</strong> for underwriter review.</div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4" [disabled]="loanForm.invalid || loading()">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span>Submitting... } @else { <i class="bi bi-send me-2"></i>Submit }
              </button>
              <a routerLink="/customer/dashboard" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
