<div class="container py-4">
  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/customer/dashboard" class="text-decoration-none">Dashboard</a></li>
      <li class="breadcrumb-item active">Apply for Loan</li>
    </ol>
  </nav>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>Loan Application Form</h5>
        </div>
        <div class="card-body p-4">
          <form>
            <!-- Loan Product Selection -->
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-box me-2"></i>Select Loan Product</h6>
              <div class="mb-3">
                <label for="loanCode" class="form-label">Loan Product <span class="text-danger">*</span></label>
                <select class="form-select" id="loanCode">
                  <option value="">-- Select a Loan Product --</option>
                  <option value="LP001">LP001 - Home Loan (8.5%)</option>
                  <option value="LP002">LP002 - Personal Loan (11.5%)</option>
                  <option value="LP003">LP003 - Education Loan (9.1%)</option>
                </select>
              </div>
              <!-- Product Details Preview -->
              <div class="row g-2">
                <div class="col-md-4">
                  <div class="bg-white rounded p-2 text-center">
                    <small class="text-muted d-block">Loan Type</small>
                    <strong>HOME</strong>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="bg-white rounded p-2 text-center">
                    <small class="text-muted d-block">Interest Rate</small>
                    <strong>8.5%</strong>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="bg-white rounded p-2 text-center">
                    <small class="text-muted d-block">Daily Penalty</small>
                    <strong>0.05%</strong>
                  </div>
                </div>
              </div>
            </div>

            <!-- Loan Details -->
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-cash-stack me-2"></i>Loan Details</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="loanAmount" class="form-label">Loan Amount (₹) <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text">₹</span>
                    <input type="number" class="form-control" id="loanAmount" placeholder="e.g., 500000">
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="emiAmount" class="form-label">EMI Amount (₹) <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text">₹</span>
                    <input type="number" class="form-control" id="emiAmount" placeholder="e.g., 15000">
                  </div>
                </div>
              </div>
            </div>

            <!-- Dates -->
            <div class="form-section">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-calendar3 me-2"></i>Loan Dates</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="loanStartDate" class="form-label">Loan Start Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="loanStartDate">
                </div>
                <div class="col-md-6">
                  <label for="emiDueDate" class="form-label">First EMI Due Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="emiDueDate">
                </div>
              </div>
            </div>

            <div class="alert alert-info small">
              <i class="bi bi-info-circle me-2"></i>
              Your loan application will be submitted with <strong>PENDING</strong> status. An underwriter will review and approve or reject it.
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-send me-2"></i>Submit Application
              </button>
              <button type="reset" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-counterclockwise me-2"></i>Reset
              </button>
              <a routerLink="/customer/dashboard" class="btn btn-outline-danger px-4 ms-auto">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
