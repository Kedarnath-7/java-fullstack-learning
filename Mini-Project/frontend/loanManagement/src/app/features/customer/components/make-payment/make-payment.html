<div class="container py-4">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/customer/dashboard" class="text-decoration-none">Dashboard</a></li>
      <li class="breadcrumb-item active">Make EMI Payment</li>
    </ol>
  </nav>
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-success text-white py-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-credit-card me-2"></i>EMI Payment</h5>
        </div>
        <div class="card-body p-4">
          @if (error()) { <div class="alert alert-danger small"><i class="bi bi-exclamation-circle me-1"></i>{{ error() }}</div> }
          @if (success()) { <div class="alert alert-success small"><i class="bi bi-check-circle me-1"></i>Payment successful! Redirecting...</div> }
          <form (ngSubmit)="onSubmit()" #payForm="ngForm">
            <div class="form-section">
              <h6 class="fw-bold text-success mb-3">Select Loan Account</h6>
              <select class="form-select" name="loanAccountId" [(ngModel)]="form.loanAccountId" required>
                <option [ngValue]="0" disabled>-- Select Active Loan --</option>
                @for (loan of activeLoans(); track loan.loanAccountId) {
                  <option [ngValue]="loan.loanAccountId">#{{ loan.loanAccountId }} - {{ loan.loanCode }} - {{ loan.loanAmount | currency:'INR':'symbol':'1.0-0' }} ({{ loan.loanStatus }})</option>
                }
              </select>
            </div>
            <div class="form-section">
              <h6 class="fw-bold text-success mb-3">Payment Details</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Amount <span class="text-danger">*</span></label>
                  <div class="input-group"><span class="input-group-text">&#8377;</span>
                    <input type="number" class="form-control" name="amountPaid" [(ngModel)]="form.amountPaid" required min="1">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Penalty <span class="text-danger">*</span></label>
                  <div class="input-group"><span class="input-group-text">&#8377;</span>
                    <input type="number" class="form-control" name="penaltyPaid" [(ngModel)]="form.penaltyPaid" required min="0">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Payment Mode <span class="text-danger">*</span></label>
                  <select class="form-select" name="paymentType" [(ngModel)]="form.paymentType" required>
                    <option value="">-- Select --</option>
                    <option>UPI</option><option>ONLINE</option><option>CARD</option><option>CASH</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" name="paymentDate" [(ngModel)]="form.paymentDate" required>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success px-4" [disabled]="payForm.invalid || loading() || form.loanAccountId === 0">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span>Processing... } @else { <i class="bi bi-check-circle me-2"></i>Confirm Payment }
              </button>
              <a routerLink="/customer/dashboard" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
