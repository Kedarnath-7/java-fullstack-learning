<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NorthernArc Loan Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bank2 me-2"></i>NorthernArc
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle fs-1 text-primary"></i>
                            <h4 class="fw-bold mt-2">Welcome Back</h4>
                            <p class="text-muted small">Sign in to your account</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required minlength="8">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-decoration-none">Register</a></p>
                        </div>

                        <!-- Demo Credentials -->
                        <hr>
                        <div class="small">
                            <p class="fw-bold text-muted mb-2">Demo Credentials:</p>
                            <div class="d-flex flex-column gap-1">
                                <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCredentials('admin@northernarc.com','Admin@123')">
                                    <i class="bi bi-person-fill-gear me-1"></i>Admin
                                </button>
                                <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCredentials('manager@northernarc.com','Manager@123')">
                                    <i class="bi bi-person-fill-lock me-1"></i>Manager
                                </button>
                                <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCredentials('underwriter@northernarc.com','Underwriter@123')">
                                    <i class="bi bi-clipboard-check me-1"></i>Underwriter
                                </button>
                                <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCredentials('rahul.sharma@northernarc.com','password123')">
                                    <i class="bi bi-person me-1"></i>Customer (Rahul)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Success Modal -->
    <div class="modal fade" id="loginSuccessModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-check-circle-fill text-success fs-1 mb-3 d-block"></i>
                    <h5 class="fw-bold">Login Successful!</h5>
                    <p class="text-muted" id="loginMessage">Redirecting to your dashboard...</p>
                    <div class="d-flex gap-2 justify-content-center mt-3" id="redirectButtons"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const redirectButtons = document.getElementById('redirectButtons');
            let role = 'USER';

            if (email.includes('admin')) role = 'ADMIN';
            else if (email.includes('manager')) role = 'MANAGER';
            else if (email.includes('underwriter')) role = 'UNDERWRITER';

            const dashboardMap = {
                'ADMIN': { url: 'admin-dashboard.html', label: 'Admin Dashboard' },
                'MANAGER': { url: 'admin-dashboard.html', label: 'Manager Dashboard' },
                'UNDERWRITER': { url: 'underwriter-dashboard.html', label: 'Underwriter Dashboard' },
                'USER': { url: 'customer-dashboard.html', label: 'Customer Dashboard' }
            };

            const target = dashboardMap[role];
            document.getElementById('loginMessage').textContent = `Welcome! Role: ${role}. Redirecting...`;
            redirectButtons.innerHTML = `<a href="${target.url}" class="btn btn-primary">${target.label}</a>`;

            const modal = new bootstrap.Modal(document.getElementById('loginSuccessModal'));
            modal.show();
        });
    </script>
</body>
</html>
