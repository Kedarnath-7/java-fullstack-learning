<!DOCTYPE html>
<html>
    <head><title>Forms</title></head>
    <body>
        <form action="welcome.html" method="post">
            <table>
                <tr>
                    <td style="color: blueviolet; font-size: 16px;">Username:</td>
                    <td><input type="text" name="username" placeholder="Enter your username"></td>
                </tr>
                <tr>
                    <td style="color: blueviolet; font-size: 16px;">Password:</td>
                    <td><input type="password" name="password" placeholder="Enter your password"></td>
                </tr>
                <tr>
                    <td style="color: blueviolet; font-size: 16px;">Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td style="color: blueviolet; font-size: 16px;">Skills:</td>
                    <td>
                        <input type="checkbox" name="skills" value="java"> Java
                        <input type="checkbox" name="skills" value="python"> Python
                        <input type="checkbox" name="skills" value="javascript"> JavaScript
                    </td>
                </tr>
                <tr>
                    <td><input type="submit" value="Login"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
