<html>
    <head>
        <title>DOM</title>
    </head>
    <body>
        <h1 class="myH1">
            This is heading
        </h1>
        <h1 id="myID">
            This is another heading which has ID
        </h1>
        <h1 class="myH1">
            This is another other heading
        </h1>


        <script>
            alert("JS is about to start its work")
            var headings = document.getElementsByClassName("myH1");
            for(let i=0; i<headings.length;i++){
                headings[i].style.color="yellow";
                headings[i].style.backgroundColor="black";
            }

            let heading = document.getElementById("myID");
            heading.style.color="white";
            heading.style.backgroundColor="blue";
        </script>
    </body>
</html>
