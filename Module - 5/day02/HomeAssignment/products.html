        <div class="container py-5">

            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h2 class="text-center mb-0">Product Management System</h2>
                </div>

                <div class="card-body">

                    <div class="mb-4 text-center">
                        <button class="btn btn-primary me-2" onClick="showInnerHtml()">Refresh</button>

                        <button class="btn btn-success me-2" onClick="sortByName()">Sort by Name</button>

                        <button class="btn btn-warning text-dark" onClick="sortByBrand()">Sort by Brand</button>
                    </div>

                    <div class="row g-3 mb-4">

                        <div class="col-md-3">
                            <input
                            id="productName"
                            type="text"
                            class="form-control"
                            placeholder="Product Name">
                        </div>

                        <div class="col-md-3">
                            <input
                            id="productPrice"
                            type="number"
                            class="form-control"
                            placeholder="Price">
                        </div>

                        <div class="col-md-3">
                            <input
                            id="productBrand"
                            type="text"
                            class="form-control"
                            placeholder="Brand">
                        </div>

                        <div class="col-md-3">
                            <input
                            id="productCategory"
                            type="text"
                            class="form-control"
                            placeholder="Category">
                        </div>

                        <div class="col-md-3">
                            <input
                            id="productStock"
                            type="number"
                            class="form-control"
                            placeholder="Stock">
                        </div>

                    </div>

                    <div class="text-center mb-4">
                        <button class="btn btn-danger px-5" onClick="addNewProduct()">
                            Add Product
                        </button>
                    </div>

                    <div id="content"></div>

                </div>
            </div>

        </div>



        <script>
            // let products = [

            //     {name: "Protein Eggs", cost: 80, brand: "Licious", category: "Food", stock: 50},
            //     {name: "Soya Chunks", cost: 40, brand: "Fortune", category: "Food", stock: 40},
            //     {name: "Strech Band", cost: 200, brand: "Slovic", category: "Fitness", stock: 30},
            //     {name: "Yoga Mat", cost: 250, brand: "LifeLong", category: "Essentials", stock: 20}
            // ];

            let products = [];

            function showInnerHtml(){
                
                const rows = products.map(product => {
                        return `
                            <tr>
                                <td>${product.product_id}</td>
                                <td>${product.name}</td>
                                <td>₹${product.cost.toLocaleString()}</td>
                                <td>${product.brand}</td>
                                <td>${product.category}</td>
                                <td>${product.stock}</td>
                                <td>
                                <button class="btn btn-sm btn-danger"
                                onClick="deleteProduct('${product.product_id}')">
                                Remove
                                </button>
                                </td>
                                <td>
                                <button
                                class="btn btn-sm btn-warning"
                                onClick="updateProduct('${product.product_id}', '${product.name}', ${product.cost}, '${product.brand}', '${product.category}', ${product.stock})">
                                Update
                                </button>
                                </td>
                            </tr>
                        `;
                }).join("");

                const content = `
                    <div class="table-responsive">
                    <table class="table table-bordered table-hover table-striped align-middle text-center shadow">
                        <thead>
                            <tr>
                                <th>Product ID</th>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                    </div>
                `;
                    
                document.getElementById("content").innerHTML=content;
                             
            }

            function sortByName(){
                products.sort((a, b) => a.name.localeCompare(b.name));
                showInnerHtml();
            }

            function sortByBrand(){
                products.sort((a, b) => a.brand.localeCompare(b.brand));
                showInnerHtml();
            }

            function removeById(removeId){
                products = products.filter(product => product.product_id !== removeId);
                deleteProduct(removeId); // Call the function to delete the product from the server
            }

            
            function addProduct(){
                let newProduct = {
                    name: document.getElementById("productName").value,
                    cost: parseFloat(document.getElementById("productPrice").value),
                    brand: document.getElementById("productBrand").value,
                    category: document.getElementById("productCategory").value,
                    stock: parseInt(document.getElementById("productStock").value)
                };
                products.push(newProduct);

                showInnerHtml();
            }

            // function updateProduct(id, name, price, brand, category, stock) {
            //     const updatedName = prompt("Enter updated product name:", name);
            //     const updatedPrice = prompt("Enter updated product price:", price);
            //     const updatedBrand = prompt("Enter updated product brand:", brand);
            //     const updatedCategory = prompt("Enter updated product category:", category);
            //     const updatedStock = prompt("Enter updated product stock:", stock);

            //     if (updatedName === null || updatedName.trim() === "") {
            //         return;
            //     }

            //     const index = products.findIndex(product => product.id === id);

            //     if (index !== -1) {
            //         products[index].name = updatedName.trim();
            //         products[index].cost = parseFloat(updatedPrice);
            //         products[index].brand = updatedBrand.trim();
            //         products[index].category = updatedCategory.trim();
            //         products[index].stock = parseInt(updatedStock);
            //     }
            //     updateProduct(id, products[index]); // Call the function to update the product on the server
            // }

            window.onload = function() {
                getAllProducts();
            };

            function getAllProducts() {
                fetch("http://localhost:8080/api/products").then((response)=>{return response.json();})
                .then(data =>{
                        console.log(data);
                        products= data;
                        showInnerHtml();
                })
                .catch(err=>{
                    console.log("There was some problem in contacting the server: "+err);
                });
            }

            function addNewProduct() {
                const newProduct = {
                    name: document.getElementById("productName").value,
                    cost: parseFloat(document.getElementById("productPrice").value),
                    brand: document.getElementById("productBrand").value,
                    category: document.getElementById("productCategory").value,
                    stock: parseInt(document.getElementById("productStock").value)
                };

                fetch("http://localhost:8080/api/products", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(newProduct)
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Product added:", data);
                    getAllProducts(); // Refresh the product list
                })
                .catch(err => {
                    console.log("There was some problem in contacting the server: " + err);
                });
            }

            function deleteProduct(productId) {
                fetch(`http://localhost:8080/api/products/${encodeURIComponent(productId)}`, {
                    method: "DELETE"
                })
                .then(response => {
                    if (response.ok) {
                        console.log("Product deleted:", productId);
                        getAllProducts(); // Refresh the product list
                    } else {
                        console.log("Failed to delete product:", productId);
                    }
                })
                .catch(err => {
                    console.log("There was some problem in contacting the server: " + err);
                });
            }

            function updateProduct(productId, name, price, brand, category, stock) {
                const updatedName = prompt("Enter updated product name:", name);
                const updatedPrice = prompt("Enter updated product price:", price);
                const updatedBrand = prompt("Enter updated product brand:", brand);
                const updatedCategory = prompt("Enter updated product category:", category);
                const updatedStock = prompt("Enter updated product stock:", stock);

                if (updatedName === null || updatedName.trim() === "") {
                    return;
                }

                const index = products.findIndex(product => product.product_id === productId);

                if (index !== -1) {
                    products[index].name = updatedName.trim();
                    products[index].cost = parseFloat(updatedPrice);
                    products[index].brand = updatedBrand.trim();
                    products[index].category = updatedCategory.trim();
                    products[index].stock = parseInt(updatedStock);
                }

                console.log(products[index]);
                console.log(JSON.stringify(products[index]));
                fetch(`http://localhost:8080/api/products/${encodeURIComponent(productId)}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(products[index])
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Product updated:", data);
                    getAllProducts(); // Refresh the product list
                })
                .catch(err => {
                    console.log("There was some problem in contacting the server: " + err);
                });
            }

        </script>
