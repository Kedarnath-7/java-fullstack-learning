<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .profile-card {
            max-width: 900px;
            margin: auto;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #0d6efd;
        }

        .detail {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .detail span {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container py-5">

    <!-- Profile Display Card -->

    <div class="card shadow-lg profile-card mb-5">

        <div class="card-header bg-primary text-white">
            <h2 class="text-center mb-0">
                My Profile
            </h2>
        </div>

        <div class="card-body">

            <div class="text-center mb-4">

                <img
                    src="1000112780.jpg"
                    class="profile-img">

            </div>

            <div class="row">

                <div class="col-md-6">

                    <p class="detail">
                        Name :
                        <span id="displayName">Kedarnath N</span>
                    </p>

                    <p class="detail">
                        Age :
                        <span id="displayAge">21</span>
                    </p>
                    <p class="detail">

                        Gender :

                        <span id="displayGender">

                            Male

                        </span>

                    </p>

                    <p class="detail">
                        Email :
                        <span id="displayEmail">kedarnath@gmail.com</span>
                    </p>

                    <p class="detail">
                        Phone :
                        <span id="displayPhone">9182525868</span>
                    </p>

                </div>

                <div class="col-md-6">

                    <p class="detail">
                        City :
                        <span id="displayCity">Banglore</span>
                    </p>

                    <p class="detail">
                        Profession :
                        <span id="displayProfession">
                            Java Full Stack Trainee
                        </span>
                    </p>

                    <p class="detail">
                        Skills :
                        <span id="displaySkills">
                            Java, HTML, CSS, Python, AI/ML
                        </span>
                    </p>
                    <p class="detail">

                        Experience :

                        <span id="displayExperience">

                            0 Years

                        </span>

                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- Update Form -->

    <div class="card shadow-lg profile-card">

        <div class="card-header bg-success text-white">
            <h3 class="text-center mb-0">
                Update Profile
            </h3>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">Name</label>

                    <input
                        id="name"
                        type="text"
                        class="form-control"
                        value="Kedarnath N">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Age</label>

                    <input
                        id="age"
                        type="number"
                        class="form-control"
                        value="21">

                </div>
                <div class="col-md-6">

                <label class="form-label d-block">

                Gender

                </label>

                <div class="form-check">

                <input
                class="form-check-input"
                type="radio"
                name="gender"
                value="Male"
                checked>

                <label class="form-check-label">

                Male

                </label>

                </div>

                <div class="form-check">

                <input
                class="form-check-input"
                type="radio"
                name="gender"
                value="Female">

                <label class="form-check-label">

                Female

                </label>

                </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label">Email</label>

                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        value="kedarnath@gmail.com">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Phone</label>

                    <input
                        id="phone"
                        type="text"
                        class="form-control"
                        value="9182525868">

                </div>

                <div class="col-md-6">

                    <label class="form-label">City</label>

                    <select id="city" class="form-select">

                        <option>Chennai</option>
                        <option>Bangalore</option>
                        <option>Hyderabad</option>
                        <option>Mumbai</option>
                        <option>Delhi</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label d-block">

                        Profession

                    </label>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="profession"
                            value="Java Full Stack Trainee"
                            checked>

                        <label class="form-check-label">

                            Java Full Stack Trainee

                        </label>

                    </div>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="profession"
                            value="Frontend Developer">

                        <label class="form-check-label">

                            Frontend Developer

                        </label>

                    </div>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="profession"
                            value="Backend Developer">

                        <label class="form-check-label">

                            Backend Developer

                        </label>

                    </div>

                </div>

                <div class="col-md-12">

                <label class="form-label d-block">

                    Skills

                </label>

                <div class="form-check form-check-inline">

                    <input
                        class="form-check-input skill"
                        type="checkbox"
                        value="Java"
                        checked>

                    <label class="form-check-label">

                        Java

                    </label>

                </div>

                <div class="form-check form-check-inline">

                    <input
                        class="form-check-input skill"
                        type="checkbox"
                        value="HTML"
                        checked>

                    <label class="form-check-label">

                        HTML

                    </label>

                </div>

                <div class="form-check form-check-inline">

                    <input
                        class="form-check-input skill"
                        type="checkbox"
                        value="CSS"
                        checked>

                    <label class="form-check-label">

                        CSS

                    </label>

                </div>

                <div class="form-check form-check-inline">

                    <input
                        class="form-check-input skill"
                        type="checkbox"
                        value="Spring Boot">

                    <label class="form-check-label">

                        Spring Boot

                    </label>

                </div>

            </div>

            <div class="col-md-12">

                <label class="form-label">

                    Experience (Years)

                </label>

                <input
                    type="range"
                    class="form-range"
                    id="experience"
                    min="0"
                    max="10"
                    value="0">

            </div>

            <div class="text-center mt-4">

                <button
                    class="btn btn-primary px-5"
                    onclick="updateProfile()">

                    Update Profile

                </button>

            </div>

        </div>

    </div>

</div>

<script>

    function updateProfile(){

    document.getElementById("displayName").textContent =
    document.getElementById("name").value;

    document.getElementById("displayAge").textContent =
    document.getElementById("age").value;

    document.getElementById("displayEmail").textContent =
    document.getElementById("email").value;

    document.getElementById("displayPhone").textContent =
    document.getElementById("phone").value;

    document.getElementById("displayCity").textContent =
    document.getElementById("city").value;

    document.getElementById("displayGender").textContent =
    document.querySelector('input[name="gender"]:checked').value;

    document.getElementById("displayProfession").textContent =
    document.querySelector('input[name="profession"]:checked').value;

    document.getElementById("displayExperience").textContent =
    document.getElementById("experience").value + " Years";

    let skills=[];

    document.querySelectorAll(".skill:checked").forEach(skill=>{

        skills.push(skill.value);

    });

    document.getElementById("displaySkills").textContent =
    skills.join(", ");

    alert("Profile Updated Successfully!");

}

</script>

</body>

</html>
