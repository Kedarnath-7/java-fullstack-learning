<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #eef2f7;
            height: 100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .game-card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            text-align:center;
        }

        .board{
            display:grid;
            grid-template-columns:repeat(3,90px);
            gap:10px;
            justify-content:center;
            margin-top:20px;
        }

        .cell{
            width:90px;
            height:90px;
            border:2px solid #0d6efd;
            border-radius:10px;
            background:#f8f9fa;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:2rem;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .cell:hover{
            background:#e9ecef;
        }

        .winner{
            background:#198754 !important;
            color:white;
        }

        #status{
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="game-card">

    <h2 class="text-primary mb-3">Tic Tac Toe</h2>

    <div id="status">Turn : X</div>

    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

</div>

<script>

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");

let count = 1;
let gameOver = false;

const patterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function checkWinner(){

    for(let pattern of patterns){

        let [a,b,c] = pattern;

        if(
            cells[a].textContent !== "" &&
            cells[a].textContent === cells[b].textContent &&
            cells[b].textContent === cells[c].textContent
        ){

            cells[a].classList.add("winner");
            cells[b].classList.add("winner");
            cells[c].classList.add("winner");

            return cells[a].textContent;
        }
    }

    return null;
}

cells.forEach(cell=>{

    cell.addEventListener("click",()=>{

        if(cell.textContent !== "" || gameOver)
            return;

        if(count % 2 != 0)
            cell.textContent = "X";
        else
            cell.textContent = "O";

        // Check winner after every click
        let winner = checkWinner();

        if(winner){
            status.textContent = winner + " Wins!";
            gameOver = true;
            return;
        }

        if(count == 9){
            status.textContent = "Game Draw!";
            gameOver = true;
            return;
        }

        count++;

        status.textContent = "Turn : " + (count % 2 != 0 ? "X" : "O");

    });

});

</script>

</body>
</html>
