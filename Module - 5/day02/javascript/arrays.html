<html>
    <head><title>Arrays</title></head>
    <body>
        <script>
            myArr = [1, 2, "A", "C", true, null];
            console.log(myArr[2]);
            for(let i = 0; i < myArr.length; i++){
                console.log(myArr[i]);
            }
            obj = {
                fName: "Kedarnath",
                lName: "Nagaradone",
                greet: function(){
                    alert("Hi " + this.fName + " " + this.lName);
                }
            }
            console.log(obj);
            obj.greet();
        </script>
    </body>
</html>
