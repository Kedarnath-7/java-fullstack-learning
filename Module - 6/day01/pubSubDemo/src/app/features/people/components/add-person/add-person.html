<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Add Person</h5>
    </div>

    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input
          type="text"
          class="form-control"
          placeholder="Enter name"
          [(ngModel)]="name">
      </div>

      <button
        class="btn btn-success"
        (click)="addPerson()">
        Add Person
      </button>
    </div>
  </div>
</div>
