<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Update Person</h5>
    </div>

    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Old Name</label>
        <input
          type="text"
          class="form-control"
          placeholder="Enter old name"
          [(ngModel)]="oldName">
      </div>

      <div class="mb-3">
        <label class="form-label">New Name</label>
        <input
          type="text"
          class="form-control"
          placeholder="Enter new name"
          [(ngModel)]="newName">
      </div>

      <button
        class="btn btn-primary"
        (click)="updatePerson()">
        Update Person
      </button>
    </div>
  </div>
</div>
