<section class="card shadow-sm border-0">
  <div class="card-body p-4">
    <h2 class="h4 mb-3">Add Employee</h2>

    @if(status().error) {
      <div class="alert alert-danger py-2" role="alert">
        {{ status().error }}
      </div>
    }

    @if(status().success) {
      <div class="alert alert-success py-2" role="alert">
        Employee added successfully.
      </div>
    }

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="employeeName">Name</label>
        <input
          id="employeeName"
          name="employeeName"
          type="text"
          class="form-control"
          [(ngModel)]="employee.name"
          placeholder="Enter full name"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="employeeEmail">Email</label>
        <input
          id="employeeEmail"
          name="employeeEmail"
          type="email"
          class="form-control"
          [(ngModel)]="employee.email"
          placeholder="name@example.com"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="employeeDept">Department</label>
        <select id="employeeDept" name="employeeDept" class="form-select" [(ngModel)]="employee.dept">
          <option value="">Select Department</option>
          <option value="HR">HR</option>
          <option value="Engineering">Engineering</option>
          <option value="Sales">Sales</option>
        </select>
      </div>
    </div>

    <div class="mt-3">
      <button class="btn btn-primary" type="button" [disabled]="status().loading" (click)="addEmployee()">
        @if(status().loading) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Adding...
        } @else {
          Add Employee
        }
      </button>
    </div>
  </div>
</section>
