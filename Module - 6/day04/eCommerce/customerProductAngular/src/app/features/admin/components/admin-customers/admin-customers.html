<div class="container mt-4 pb-5">
  <h2 class="fw-bold mb-4"><i class="bi bi-people me-2"></i>All Customers</h2>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th class="text-center">Orders</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            @for (customer of customers(); track customer.id) {
              <tr>
                <td>{{ customer.id }}</td>
                <td class="fw-semibold">{{ customer.fName }}</td>
                <td>{{ customer.lName }}</td>
                <td class="text-center"><span class="badge bg-primary">{{ customer.orders.length }}</span></td>
                <td class="text-center">
                  <button class="btn btn-outline-danger btn-sm" (click)="deleteCustomer(customer.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            }
            @if (customers().length === 0) {
              <tr><td colspan="5" class="text-center text-muted py-4">No customers found</td></tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <a routerLink="/admin" class="btn btn-outline-secondary mt-3">
    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
  </a>
</div>
