<div class="container mt-4 pb-5">
  <h2 class="fw-bold mb-4">
    <i class="bi bi-box-seam me-2"></i>{{ isEdit ? 'Edit' : 'Add' }} Product
  </h2>

  @if (errorMessage()) {
    <div class="alert alert-danger">{{ errorMessage() }}</div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Product Name</label>
            <input type="text" class="form-control" [(ngModel)]="formData.name" name="name" required placeholder="e.g. Galaxy S24 Ultra">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Brand</label>
            <input type="text" class="form-control" [(ngModel)]="formData.brand" name="brand" required placeholder="e.g. Samsung">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Category</label>
            <input type="text" class="form-control" [(ngModel)]="formData.category" name="category" required placeholder="e.g. Smartphones">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Cost (&#8377;)</label>
            <input type="number" class="form-control" [(ngModel)]="formData.cost" name="cost" required min="0.01" step="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Stock</label>
            <input type="number" class="form-control" [(ngModel)]="formData.stock" name="stock" required min="0">
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>{{ isEdit ? 'Update' : 'Add' }} Product
          </button>
          <a routerLink="/admin/products" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
