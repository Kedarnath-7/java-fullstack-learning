<!-- Register Page -->
<div class="auth-container">
  <div class="card auth-card">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-1">Create Account</h4>
      <p class="text-muted mb-4">Join ShopEase today</p>

      @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      <form (ngSubmit)="onRegister()">
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" placeholder="Rahul"
                   [(ngModel)]="registerData.fName" name="fName" required>
          </div>
          <div class="col-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" placeholder="Sharma"
                   [(ngModel)]="registerData.lName" name="lName" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="you@example.com"
                   [(ngModel)]="registerData.email" name="email" required>
          </div>
          <div class="form-text">Must be a valid and unique email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" placeholder="Min 8 characters"
                   [(ngModel)]="registerData.password" name="password" required minlength="8">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" placeholder="Confirm your password"
                   [(ngModel)]="confirmPassword" name="confirmPassword" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <hr class="my-4">
      <p class="text-center text-muted small mb-0">
        Already have an account?
        <a routerLink="/login" class="fw-semibold">Sign In</a>
      </p>
    </div>
  </div>
</div>
